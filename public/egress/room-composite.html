<!DOCTYPE html>
<!--
  LiveKit's recorder page for a class recording that must leave certain
  participants out (see stcbe's LiveKitService.startRecording).

  This is NOT a page a person ever opens. LiveKit's Egress service launches its
  own headless Chrome, loads this exact file with `?url=...&token=...&layout=...`
  appended, and records whatever it renders. It is a static file (not a Next.js
  page) on purpose: every real page in this app is wrapped in providers that
  redirect an unauthenticated visitor to /auth/login (see app/layout.tsx's
  UserProvider), and this page has no session cookie at all - LiveKit's browser
  is not a logged-in user. A static file under public/ sidesteps that entirely.

  The protocol below (read url/token/layout from the query string; log the
  literal strings START_RECORDING/END_RECORDING to signal readiness/completion)
  is LiveKit's own documented custom-template contract - see the (tiny, official)
  @livekit/egress-sdk source, reimplemented directly here rather than pulled in
  as a dependency, since a build step would defeat the point of a plain static
  file LiveKit's browser can load with nothing else to fetch or compile.

  Who ends up in the recording is decided entirely by the `layout` param, in one
  of two forms:
    - "exclude:<id1>,<id2>,..." - everyone EXCEPT these participant identities
      (User ids - see LiveKitService.issueToken). Used for a group class where
      some families haven't consented to recording.
    - "only:<id>" - ONLY this one identity (the tutor). Used for "tutor only"
      recording, where no student needs to consent at all because no student
      ever appears.
  Either way, this page connects with autoSubscribe turned off, so it never
  even receives a not-included identity's audio/video - their media never
  reaches this page, let alone the recording, rather than being merely hidden
  after the fact.

  Layout: whenever a screen share is live, it takes the large main area and
  every camera becomes a small strip tile alongside it (same idea as Google
  Meet's "presenting" view) - with no screen share, cameras fall back to an
  even grid. Every tile uses object-fit: contain, never cover, so a face or a
  slide is always shown in full rather than cropped to fill its box.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Class recording</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #0b0b0f; overflow: hidden; }
      #root {
        display: flex;
        flex-direction: row;
        width: 100%;
        height: 100%;
        gap: 4px;
        padding: 4px;
        box-sizing: border-box;
      }
      #plainGrid {
        display: grid;
        grid-auto-rows: 1fr;
        width: 100%;
        height: 100%;
        gap: 4px;
        box-sizing: border-box;
      }
      #main {
        flex: 1 1 auto;
        min-width: 0;
        display: flex;
      }
      #main .tile { flex: 1 1 auto; }
      #strip {
        flex: 0 0 220px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        overflow-y: hidden;
      }
      #strip .tile {
        flex: 0 0 auto;
        width: 100%;
        aspect-ratio: 4 / 3;
      }
      .tile {
        position: relative;
        background: #17171d;
        border-radius: 8px;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .tile video {
        width: 100%;
        height: 100%;
        /* contain, never cover: a cropped face or a slide with its edges cut
           off is exactly the problem this replaced - nothing here is ever
           cut off, at most letterboxed. */
        object-fit: contain;
      }
      .tile .name {
        position: absolute;
        left: 8px;
        bottom: 8px;
        color: #fff;
        font: 500 14px/1.2 -apple-system, Segoe UI, Roboto, sans-serif;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
      }
      #empty {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #666;
        font: 500 16px -apple-system, Segoe UI, Roboto, sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="plainGrid"></div>
      <div id="main"></div>
      <div id="strip"></div>
    </div>
    <div id="empty">Waiting for the class to begin&hellip;</div>

    <!-- Vendored, not a CDN import: this app's CSP only allows scripts from
         'self', and this page must never depend on network access it isn't
         guaranteed. Re-copy from node_modules/livekit-client/dist whenever the
         livekit-client dependency version changes. -->
    <script src="/egress/livekit-client.umd.js"></script>
    <script>
      (function () {
        "use strict";
        var LK = window.LivekitClient;
        var Room = LK.Room;
        var RoomEvent = LK.RoomEvent;
        var TrackSource = LK.Track.Source;

        var params = new URLSearchParams(window.location.search);
        var url = params.get("url");
        var token = params.get("token");
        var layout = params.get("layout") || "";

        // Parses "exclude:id1,id2" or "only:id" into a single predicate. Anything
        // else (including an empty/unrecognised value) includes everyone - the
        // safe default is to record everyone rather than silently record no one.
        var shouldInclude = function () { return true; };
        if (layout.indexOf("exclude:") === 0) {
          var excluded = new Set(
            layout
              .slice("exclude:".length)
              .split(",")
              .map(function (s) { return s.trim(); })
              .filter(Boolean)
          );
          shouldInclude = function (identity) { return !excluded.has(identity); };
        } else if (layout.indexOf("only:") === 0) {
          var onlyIdentity = layout.slice("only:".length).trim();
          shouldInclude = function (identity) { return identity === onlyIdentity; };
        }

        var plainGrid = document.getElementById("plainGrid");
        var main = document.getElementById("main");
        var strip = document.getElementById("strip");
        var empty = document.getElementById("empty");
        // Keyed by "identity:source" (not just identity) so a tutor who is
        // both on camera AND screen-sharing gets two separate tiles instead
        // of both videos landing in one box.
        var tiles = new Map(); // key -> { el, identity, source, mediaCount }

        function keyFor(identity, source) { return identity + ":" + source; }

        // Re-parents every current tile into the right container and shows
        // only that container - called whenever a tile is added, removed, or
        // a screen share starts/stops, so the layout is always derived fresh
        // from exactly what's live right now.
        function relayout() {
          empty.style.display = tiles.size === 0 ? "flex" : "none";

          var screenEls = [];
          var cameraEls = [];
          tiles.forEach(function (t) {
            (t.source === TrackSource.ScreenShare ? screenEls : cameraEls).push(t.el);
          });

          if (screenEls.length > 0) {
            plainGrid.style.display = "none";
            main.style.display = "flex";
            strip.style.display = cameraEls.length > 0 ? "flex" : "none";
            screenEls.forEach(function (el) { main.appendChild(el); });
            cameraEls.forEach(function (el) { strip.appendChild(el); });
          } else {
            main.style.display = "none";
            strip.style.display = "none";
            plainGrid.style.display = "grid";
            var n = cameraEls.length;
            var cols = Math.max(1, Math.ceil(Math.sqrt(n)));
            plainGrid.style.gridTemplateColumns = "repeat(" + cols + ", 1fr)";
            cameraEls.forEach(function (el) { plainGrid.appendChild(el); });
          }
        }

        function tileFor(participant, source) {
          var key = keyFor(participant.identity, source);
          var existing = tiles.get(key);
          if (existing) return existing;
          var tile = document.createElement("div");
          tile.className = "tile";
          var label = document.createElement("div");
          label.className = "name";
          label.textContent =
            (participant.name || participant.identity) + (source === TrackSource.ScreenShare ? " - screen" : "");
          tile.appendChild(label);
          var entry = { el: tile, identity: participant.identity, source: source, mediaCount: 0 };
          tiles.set(key, entry);
          relayout();
          return entry;
        }

        function removeTileIfEmpty(key) {
          var entry = tiles.get(key);
          if (!entry || entry.mediaCount > 0) return;
          entry.el.remove();
          tiles.delete(key);
          relayout();
        }

        function subscribeAllOf(participant) {
          if (!shouldInclude(participant.identity)) return;
          participant.trackPublications.forEach(function (publication) {
            if (!publication.isSubscribed) publication.setSubscribed(true);
          });
        }

        var room = new Room();

        room.on(RoomEvent.TrackPublished, function (publication, participant) {
          if (!shouldInclude(participant.identity)) return;
          publication.setSubscribed(true);
        });

        room.on(RoomEvent.TrackSubscribed, function (track, publication, participant) {
          if (!shouldInclude(participant.identity)) return; // belt-and-braces; should never subscribe in the first place
          var source = publication.source;
          var entry = tileFor(participant, source);
          var el = track.attach();
          entry.el.appendChild(el);
          entry.mediaCount += 1;
        });

        room.on(RoomEvent.TrackUnsubscribed, function (track, publication, participant) {
          track.detach().forEach(function (el) { el.remove(); });
          var key = keyFor(participant.identity, publication.source);
          var entry = tiles.get(key);
          if (entry) entry.mediaCount = Math.max(0, entry.mediaCount - 1);
          removeTileIfEmpty(key);
        });

        room.on(RoomEvent.ParticipantDisconnected, function (participant) {
          var changed = false;
          tiles.forEach(function (entry, key) {
            if (entry.identity !== participant.identity) return;
            entry.el.remove();
            tiles.delete(key);
            changed = true;
          });
          if (changed) relayout();
        });

        // LiveKit's custom-template contract: the page logs this literal string
        // once it's connected and ready; Egress's controller watches the
        // browser console for it before it starts capturing frames.
        room.on(RoomEvent.Disconnected, function () {
          console.log("END_RECORDING");
        });

        room
          .connect(url, token, { autoSubscribe: false })
          .then(function () {
            room.remoteParticipants.forEach(subscribeAllOf);
            console.log("START_RECORDING");
          })
          .catch(function (err) {
            console.error("Recorder failed to connect", err);
          });
      })();
    </script>
  </body>
</html>
